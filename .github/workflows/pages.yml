# מפרסם את גרסת הדפדפן של המשחק ב-GitHub Pages (https://<user>.github.io/knesset/).
# מופעל ידנית (Actions ← Web (GitHub Pages) ← Run workflow), או בכל push אם הוגדר משתנה PAGES_ENABLED=true.
# לפני הפעם הראשונה: Settings ← Pages ← Source: GitHub Actions.
name: Web (GitHub Pages)

on:
  push:
    branches: [ccr-b895278b-7u0siq, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
